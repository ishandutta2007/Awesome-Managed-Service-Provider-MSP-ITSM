<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.18); opacity: 0.45; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPillSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillFast {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-11px); }
    }
    @keyframes pingStatus {
      0% { r: 4px; opacity: 1; }
      100% { r: 9px; opacity: 0; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite 3s; transform-origin: 1000px 220px; }
    .flowing-data-line { stroke-dasharray: 20, 10; animation: flowLine 25s linear infinite; }
    .pill-1 { animation: floatPillSlow 5s ease-in-out infinite; }
    .pill-2 { animation: floatPillFast 6s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPillSlow 5.5s ease-in-out infinite 2s; }
    .pill-4 { animation: floatPillFast 6.5s ease-in-out infinite 1.5s; }
    .ping-circle { animation: pingStatus 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="12" fill="url(#bgGrad)" />

  <!-- Technical Grid Background -->
  <g opacity="0.12">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#38bdf8" stroke-width="0.8" />
    <path d="M120 0 V340 M240 0 V340 M360 0 V340 M480 0 V340 M600 0 V340 M720 0 V340 M840 0 V340 M960 0 V340 M1080 0 V340" stroke="#38bdf8" stroke-width="0.8" />
  </g>

  <!-- Glowing Background Orbs (Strictly Deep Behind Content) -->
  <circle class="orb-1" cx="220" cy="90" r="140" fill="#0284c7" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="240" r="160" fill="#6366f1" filter="url(#glow)" />

  <!-- Animated Circuit & Data Lines -->
  <path class="flowing-data-line" d="M -50 170 Q 300 240 600 170 T 1250 170" fill="none" stroke="url(#lineGrad)" stroke-width="2" />
  <path class="flowing-data-line" d="M -50 210 Q 300 130 600 210 T 1250 210" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.6" style="animation-duration: 35s; animation-direction: reverse;" />

  <!-- Central Foreground Headers (Kept distinct, high contrast, uncluttered) -->
  <g id="header-text">
    <!-- Super Title / Tag -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="-115" cy="0" r="4" fill="#38bdf8" />
      <circle class="ping-circle" cx="-115" cy="0" r="4" fill="#38bdf8" />
      <text x="-95" y="4.5" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="2">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="118" text-anchor="middle" fill="url(#textGrad)" font-size="38" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">Awesome MSP &amp; ITSM Software</text>

    <!-- Subtitle -->
    <text x="600" y="156" text-anchor="middle" fill="url(#subTextGrad)" font-size="16" font-weight="400" letter-spacing="0.2">The Definitive Guide to Managed Service Provider, PSA, RMM &amp; IT Service Management Platforms</text>
    <text x="600" y="180" text-anchor="middle" fill="#64748b" font-size="13" font-weight="400">Enterprise SaaS Benchmarks • Open-Source Alternatives • Real Pricing • Market Dynamics</text>
  </g>

  <!-- Floating Dynamic Feature Badges in Footer Position (Never obscuring text) -->
  <g id="feature-pills" transform="translate(0, 235)">
    <!-- Pill 1: Ticketing & Service Desk -->
    <g class="pill-1" transform="translate(180, 0)">
      <rect x="-90" y="-18" width="180" height="38" rx="19" fill="#111827" stroke="#38bdf8" stroke-width="1.2" filter="url(#pillGlow)" opacity="0.95" />
      <circle cx="-65" cy="1" r="5" fill="#38bdf8" />
      <text x="-48" y="6" fill="#f1f5f9" font-size="12.5" font-weight="600">ITSM &amp; Helpdesk</text>
    </g>

    <!-- Pill 2: PSA & Client Billing -->
    <g class="pill-2" transform="translate(430, 0)">
      <rect x="-85" y="-18" width="170" height="38" rx="19" fill="#111827" stroke="#818cf8" stroke-width="1.2" filter="url(#pillGlow)" opacity="0.95" />
      <circle cx="-60" cy="1" r="5" fill="#818cf8" />
      <text x="-43" y="6" fill="#f1f5f9" font-size="12.5" font-weight="600">PSA &amp; Billing</text>
    </g>

    <!-- Pill 3: Remote Monitoring RMM -->
    <g class="pill-3" transform="translate(680, 0)">
      <rect x="-80" y="-18" width="160" height="38" rx="19" fill="#111827" stroke="#c084fc" stroke-width="1.2" filter="url(#pillGlow)" opacity="0.95" />
      <circle cx="-55" cy="1" r="5" fill="#c084fc" />
      <text x="-38" y="6" fill="#f1f5f9" font-size="12.5" font-weight="600">RMM &amp; Assets</text>
    </g>

    <!-- Pill 4: Open-Source & Self-Hosted -->
    <g class="pill-4" transform="translate(930, 0)">
      <rect x="-95" y="-18" width="190" height="38" rx="19" fill="#111827" stroke="#34d399" stroke-width="1.2" filter="url(#pillGlow)" opacity="0.95" />
      <circle cx="-70" cy="1" r="5" fill="#34d399" />
      <text x="-52" y="6" fill="#f1f5f9" font-size="12.5" font-weight="600">100% Open Source</text>
    </g>
  </g>

  <!-- Outer Glowing Accent Border -->
  <rect x="1" y="1" width="1198" height="338" rx="11" fill="none" stroke="url(#textGrad)" stroke-width="1.5" opacity="0.5" />
</svg>
